# GUARD-WORKFLOW-VERSION: 1.2.0
# repo-discipline CI 兜底 —— 为什么必须有这一道（2026-09-24 定）：
#   本地 pre-commit 能被 `git commit --no-verify` 一句话绕过去；而 `core.hooksPath` 是
#   **local 级 git config**，不随 clone 传播 ⇒ 换台机器拉下来的仓压根没有门。
#   ⇒ 凡**公开仓 / 有多人协作**的项目，必须在服务端补这一道。
#
# 下发与刷新（别手抄这个文件）：
#   bash <repo-discipline>/scripts/install-guard.sh <项目路径> --with-ci
#   它会一并下发 `scripts/repo-guard.py` 副本；上游升级后重跑同一命令即可对齐，
#   本仓内容是否与上游一致用 `--check` 现场比对（`cmp -s`，不写死 hash）。
#
# ★ 设计底线（改之前先读，别退回旧写法）
#   1. **CI 里绝不能用 `--staged`**：CI 是干净检出，暂存区恒空 ⇒ `git diff --cached` 必空
#      ⇒ 密钥扫描**假 PASS**（守卫不报错，只是它什么都没看到，输出和真干净一模一样）。
#      服务端没有「本次提交」的概念，只跑全量 `--ci` —— 它会把密钥项由 WARN 升到 FAIL。
#   2. **action 一律钉 commit SHA**：浮动标签（`@v4`）可被作者移动，在多数流水线里等价于
#      把远端代码拉进有凭据的环境执行。SHA 后面**必须留版本号注释**，否则无人知道该升到哪个 commit。
#   3. **副本与上游对齐靠 `cmp`，不靠写死 hash**：把 hash / 体积写死在这里，上游一升级就变成
#      「永远失败」，最后被人整段删掉 ⇒ 守卫静默消失。同步与验证命令见项目 AGENTS.md。
#   4. **密钥扫描不用 gitleaks-action，用官方二进制钉版本（2026-09-25）**：
#      gitleaks-action v2 对组织私有仓要 license；且少一个 action 就少一个要钉 SHA / 跟着升级的面。
#      官方二进制 + `fetch-depth: 0` 等价能力（全历史扫描），版本升级 = 改一行 URL。
#   5. **★ 额度友好（2026-09-25 v1.2.0，私有仓按分钟计费）**：CI 每分钟都是钱，但
#      **省钱的前提是不让守卫静默失效** —— 只砍「重复 / 无效」的跑，不砍覆盖面：
#        · `concurrency.cancel-in-progress` —— 连续 push 只跑**最后一次**（旧 run 直接取消）；
#        · `paths-ignore` —— 只排除**会话记忆 / 快照文档**（每次收尾必变、且不含代码与规范），
#          **不排除 `*.md`**：CHANGELOG / AGENTS / README 正是规范检查的对象，排掉等于自废武功；
#        · 密钥扫描**分层**：push / PR 扫**本次变更提交**，全历史交给**每周定时**兜底
#          （全历史最贵，但它防的「旧密钥藏在早期提交」不需要每次 push 都查一遍）；
#        · 合规检查与密钥扫描**合进一个 job** —— 少一次 runner 启动 + 一次 checkout。
#      不做的两件事：① **不按分支过滤**（漏触发 ⇒ 守卫静默消失，比多跑几次严重得多）；
#      ② **不合并成「只跑一次」** —— 本地门每次提交都跑，CI 减少的是**重复跑**，不是覆盖面。
#
# 为什么没有 actions/setup-python：repo-guard.py 只用标准库，`python3` 直接跑，
# 少一个 action 就少一个要跟着升级 / 钉 SHA 的面。

name: repo-guard

on:
  push:
    paths-ignore:                  # ★ 只排除「不含代码与规范」的目录，别拿它省一切
      - '.workbuddy/memory/**'     # 会话记忆：纯文本、每次收尾都变
      - '.memory/**'               # 状态文档（HANDOFF / PROGRESS）
      - 'docs/**'                  # 报告快照
  pull_request:
  schedule:
    - cron: '17 3 * * 1'           # 每周一 03:17 UTC —— 全历史密钥兜底（额度友好时段）
  workflow_dispatch:               # 手动触发时跑全历史（见下方 if 判定）

# 连续 push 时只保留最后一次：旧 run 直接取消，不烧分钟
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：本工作流只读代码，不需要写任何东西
permissions:
  contents: read

jobs:
  guard:
    name: repo-guard 合规检查 + 密钥扫描
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0               # 守卫要读提交历史 / 入库文件清单，浅克隆会漏判
          persist-credentials: false   # 检出后不留凭据，后续步骤拿不到 token

      - name: 守卫版本（便于症状对照）
        run: python3 scripts/repo-guard.py --version

      - name: 合规检查（CI 全量模式）
        run: python3 scripts/repo-guard.py --ci

      - name: 安装 gitleaks（官方二进制，钉版本 v8.30.1）
        run: |
          curl -sSL --fail "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz" | tar -xz
          ./gitleaks version

      # 分层：日常只扫本次变更；全历史留给每周定时 / 手动（全扫最贵，但不必每次跑）
      - name: 密钥扫描（本次变更提交）
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: |
          BEFORE="${{ github.event.before }}"
          # 首次推送 / 事件未带 before（PR 的部分事件类型）⇒ 退回最近一个提交
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="HEAD~1"
          fi
          ./gitleaks detect --source . --log-opts "$BEFORE..HEAD" --exit-code 1 --redact -v

      - name: 密钥扫描（全历史兜底）
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: ./gitleaks detect --source . --exit-code 1 --redact -v
        # 命中即 FAIL。确属占位符 / 已轮换密钥 → 先人工审，再用 `.gitleaksignore`
        # 按 fingerprint 豁免（先审再豁，不当静音；豁免条目要季度复查）
